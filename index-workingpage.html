<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skacubano | Official Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #b3b3b3;
        }
        .email-link {
            color: #f39c12; /* Color naranja/dorado para resaltar */
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: border-bottom 0.3s ease;
        }
        .email-link:hover {
            border-bottom: 2px solid #f39c12;
        }
        .logo-placeholder {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">🎺</div>
        <h1>Skacubano</h1>
        <p>We are currently updating our website.</p>
        <p>For urgent inquiries, please contact us at:<br>
            <a href="mailto:carlos@skacubano.com" class="email-link">carlos@skacubano.com</a>
        </p>
    </div>

</body>
</html>
